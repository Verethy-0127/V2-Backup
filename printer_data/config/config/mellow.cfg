#####################################################################
#                  Mellow LLL Filament Plus Buffer
#####################################################################

[mcu LLL_PLUS]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_1A003A000957465331323720-if00
restart_method: command

#####################################################################
#                       Buffer Extruder Configuration
#####################################################################

[extruder_stepper mellow]
extruder: extruder
step_pin: LLL_PLUS:PC13
dir_pin: LLL_PLUS:PA7
enable_pin: !LLL_PLUS:PA6
microsteps: 16
gear_ratio: 50:17
rotation_distance: 18.86

[tmc2208 extruder_stepper mellow]
uart_pin: LLL_PLUS:PB1
sense_resistor: 0.150
run_current: 0.300
stealthchop_threshold: 999999

#####################################################################
#                  Manual Feed/Retract Buttons
#####################################################################

[gcode_button feed_button]
pin: ^!LLL_PLUS:PB12

press_gcode:

    {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].unload_active|int == 1 %}

        M118 Feed button pressed - cancelling automatic unload
        _STOP_BUFFER_UNLOAD

    {% else %}

        M118 Feed button pressed - starting continuous feed
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=manual_operation VALUE=1
        UPDATE_DELAYED_GCODE ID=_buffer_feed_loop DURATION=0
        SET_GCODE_VARIABLE MACRO=_MANUAL_FEED VARIABLE=active VALUE=1
        _MANUAL_FEED

    {% endif %}

release_gcode:
    M118 Feed button released
    SET_GCODE_VARIABLE MACRO=_MANUAL_FEED VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_manual_feed_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_reenable_autofeed DURATION=2

[gcode_button retract_button]
pin: ^!LLL_PLUS:PB13

press_gcode:

    {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].unload_active|int == 1 %}

        M118 Retract button pressed - cancelling automatic unload
        _STOP_BUFFER_UNLOAD

    {% else %}

        M118 Retract button pressed - starting continuous retract
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=manual_operation VALUE=1
        UPDATE_DELAYED_GCODE ID=_buffer_feed_loop DURATION=0
        SET_GCODE_VARIABLE MACRO=_MANUAL_RETRACT VARIABLE=active VALUE=1
        _MANUAL_RETRACT

    {% endif %}

release_gcode:
    M118 Retract button released
    SET_GCODE_VARIABLE MACRO=_MANUAL_RETRACT VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_manual_retract_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_reenable_autofeed DURATION=2

#####################################################################
#                  Manual Control Macros
#####################################################################

[gcode_macro _MANUAL_FEED]
variable_active: 0
gcode:
    {% if active == 1 %}
        FORCE_MOVE STEPPER="extruder_stepper mellow" DISTANCE=10 VELOCITY=15 ACCEL=1000
        UPDATE_DELAYED_GCODE ID=_manual_feed_loop DURATION=0.18
    {% endif %}

[delayed_gcode _manual_feed_loop]
gcode:
    _MANUAL_FEED

[gcode_macro _MANUAL_RETRACT]
variable_active: 0
gcode:
    {% if active == 1 %}
        FORCE_MOVE STEPPER="extruder_stepper mellow" DISTANCE=-10 VELOCITY=20 ACCEL=1000
        UPDATE_DELAYED_GCODE ID=_manual_retract_loop DURATION=0.18
    {% endif %}

[delayed_gcode _manual_retract_loop]
gcode:
    _MANUAL_RETRACT

#####################################################################
#                  Buffer Automatic Control System
#####################################################################

[gcode_macro Enable_Runout_Sensor]
gcode:
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=print_running VALUE=1

[gcode_macro Disable_Runout_Sensor]
gcode:
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=print_running VALUE=0

# Filament entrance sensor - enables/disables auto-feed system
[filament_switch_sensor buffer_entrance]
switch_pin: ^!LLL_PLUS:PB7
pause_on_runout: False
insert_gcode:
    M118 Buffer: Filament detected, starting initial fill
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=system_enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=manual_operation VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=overfill_lock VALUE=0
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=init_load VALUE=1
    # Start continuous feed to fill buffer initially
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=continuous_feed VALUE=1
    _BUFFER_AUTO_CONTROL

runout_gcode:

    {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].unload_active|int == 1 %}

        # This is an intentional unload, not a filament runout.
        M118 Buffer: Filament cleared entrance sensor - unload complete

        _STOP_BUFFER_UNLOAD

        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=system_enabled VALUE=0
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=continuous_feed VALUE=0
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=overfill_lock VALUE=0
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=init_load VALUE=0

    {% else %}

        # Normal unexpected runout behaviour
        M118 Buffer: Filament runout detected at entrance

        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=system_enabled VALUE=0
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=continuous_feed VALUE=0
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=overfill_lock VALUE=0

        UPDATE_DELAYED_GCODE ID=_buffer_feed_loop DURATION=0

        {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].print_running == 1 %}
            M600
            M117 Filament runout detected - M600 started
        {% endif %}

    {% endif %}

# HALL3 - Initial fill complete sensor (neck fully retracted)
# HALL3 - Initial fill complete sensor (neck fully retracted)
[gcode_button buffer_hall3]
pin: ^!LLL_PLUS:PB4
press_gcode:
    M118 HALL3 TRIGGERED - Initial fill complete, switching to burst mode

    # Stop continuous initial feeding.
    # Normal operation is then handled by HALL2.
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=continuous_feed VALUE=0
    UPDATE_DELAYED_GCODE ID=_buffer_feed_loop DURATION=0

    # Auto-load the toolhead once per NEW filament insertion.
    # init_load is set to 1 by buffer_entrance.
    {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].init_load|int == 1 %}
        M118 Buffer: Initial fill complete - scheduling toolhead load

        # Disarm immediately so HALL3 bounce cannot trigger another load.
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=init_load VALUE=0

        # Give the buffer half a second to settle before engaging Clockwork.
        UPDATE_DELAYED_GCODE ID=_buffer_toolhead_load DURATION=0.5
    {% endif %}

release_gcode:
    M118 HALL3 RELEASED - Neck retracted (normal during operation)


[delayed_gcode _buffer_toolhead_load]
gcode:
    {% if printer.extruder.can_extrude %}
        M118 Buffer: Starting automatic toolhead load
        LOAD_FILAMENT
        M118 Buffer: Automatic toolhead load complete
    {% else %}
        M118 Buffer: Automatic toolhead load skipped - hotend too cold
    {% endif %}

# HALL2 - Primary buffer control (mid-point trigger)
[gcode_button buffer_hall2]
pin: ^!LLL_PLUS:PB3
press_gcode:
    M118 HALL2 TRIGGERED - Neck retracted, buffer OK
release_gcode:
    M118 HALL2 RELEASED - Neck extended to mid-point
    {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].manual_operation == 0 %}
        {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].system_enabled == 1 %}
            {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].overfill_lock == 0 %}
                M118 Buffer: Executing feed burst
                _BUFFER_FEED_BURST
            {% else %}
                M118 Buffer: Overfill lock active, skipping burst
            {% endif %}
        {% endif %}
    {% else %}
        M118 Buffer: Manual operation in progress, skipping burst
    {% endif %}

# HALL1 - Overfill limiter (neck extended to maximum)
[gcode_button buffer_hall1]
pin: ^!LLL_PLUS:PB2
press_gcode:
    M118 HALL1 TRIGGERED - Neck returning to safe zone, re-enabling buffer
    # Clear overfill lock when neck retracts
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=overfill_lock VALUE=0
release_gcode:
    M118 HALL1 RELEASED - Buffer overfill detected, pausing auto-feed
    # Set overfill lock to prevent feeding
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=overfill_lock VALUE=1
    # Stop any continuous feeding
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=continuous_feed VALUE=0
    UPDATE_DELAYED_GCODE ID=_buffer_feed_loop DURATION=0

#####################################################################
#                  Buffer Control Macros
#####################################################################

[gcode_macro _BUFFER_AUTO_CONTROL]
variable_system_enabled: 0
variable_continuous_feed: 0
variable_manual_operation: 0
variable_overfill_lock: 0
variable_print_running: 0
variable_init_load: 0
variable_unload_active: 0
gcode:
    # Continuous feed mode (initial fill only) - stops if overfill lock is active
    {% if system_enabled == 1 and continuous_feed == 1 and manual_operation == 0 and overfill_lock == 0 %}
        FORCE_MOVE STEPPER="extruder_stepper mellow" DISTANCE=10 VELOCITY=15 ACCEL=1000
        UPDATE_DELAYED_GCODE ID=_buffer_feed_loop DURATION=0.18
    {% endif %}

[delayed_gcode _buffer_feed_loop]
gcode:
    _BUFFER_AUTO_CONTROL

[gcode_macro _BUFFER_FEED_BURST]
gcode:
    # Small burst feed when HALL2 triggers (only if overfill lock is not active)
    {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].overfill_lock == 0 %}
        FORCE_MOVE STEPPER="extruder_stepper mellow" DISTANCE=15 VELOCITY=15 ACCEL=1000
        M118 Buffer: Feed burst complete
    {% else %}
        M118 Buffer: Burst cancelled due to overfill lock
    {% endif %}

[delayed_gcode _reenable_autofeed]
gcode:
    M118 Re-enabling auto-feed system
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=manual_operation VALUE=0


#####################################################################
#                  Automatic Buffer Unload
#####################################################################

[gcode_macro _START_BUFFER_UNLOAD]
gcode:
    {% if printer["filament_switch_sensor buffer_entrance"].filament_detected %}

        M118 Buffer: Starting automatic filament unload

        # Disable normal automatic feed behaviour while unloading
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=system_enabled VALUE=0
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=continuous_feed VALUE=0
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=manual_operation VALUE=1
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=unload_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=init_load VALUE=0

        # Stop anything else which could currently be driving the buffer
        UPDATE_DELAYED_GCODE ID=_buffer_feed_loop DURATION=0
        UPDATE_DELAYED_GCODE ID=_manual_feed_loop DURATION=0
        UPDATE_DELAYED_GCODE ID=_manual_retract_loop DURATION=0

        SET_GCODE_VARIABLE MACRO=_MANUAL_FEED VARIABLE=active VALUE=0
        SET_GCODE_VARIABLE MACRO=_MANUAL_RETRACT VARIABLE=active VALUE=0

        # Start automatic retract
        UPDATE_DELAYED_GCODE ID=_buffer_unload_loop DURATION=0.01

        # Safety fallback in case the entrance sensor never clears
        UPDATE_DELAYED_GCODE ID=_buffer_unload_timeout DURATION=75

    {% else %}

        M118 Buffer: Entrance sensor already clear - LLL unload not required

    {% endif %}


[delayed_gcode _buffer_unload_loop]
gcode:
    {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].unload_active|int == 1 %}

        # Small retract increments keep the stop response quick.
        FORCE_MOVE STEPPER="extruder_stepper mellow" DISTANCE=-5 VELOCITY=20 ACCEL=1000

        UPDATE_DELAYED_GCODE ID=_buffer_unload_loop DURATION=0.30

    {% endif %}


[gcode_macro _STOP_BUFFER_UNLOAD]
gcode:
    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=unload_active VALUE=0

    UPDATE_DELAYED_GCODE ID=_buffer_unload_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=_buffer_unload_timeout DURATION=0

    SET_GCODE_VARIABLE MACRO=_BUFFER_AUTO_CONTROL VARIABLE=manual_operation VALUE=0

    M118 Buffer: Automatic unload stopped


[delayed_gcode _buffer_unload_timeout]
gcode:
    {% if printer["gcode_macro _BUFFER_AUTO_CONTROL"].unload_active|int == 1 %}
        M118 Buffer: WARNING - automatic unload timed out
        _STOP_BUFFER_UNLOAD
    {% endif %}